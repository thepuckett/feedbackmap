[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thepuckett-feedbackmap"
version = "0.1.0"
description = "按反馈内容聚类，并标出每类指向的系统能力"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "thepuckett" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://thepuckett.github.io"
Repository = "https://github.com/thepuckett/feedbackmap"
Issues = "https://github.com/thepuckett/feedbackmap/issues"

[project.scripts]
feedbackmap = "feedbackmap:main"

[tool.setuptools]
py-modules = ["feedbackmap"]
